name: AgentOS Security & Vulnerability Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: Security Tests & Policy Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Phase 0 Security & Sandbox Suite
        run: |
          python -m pytest backend/tests/unit/test_security_phase0.py backend/tests/unit/test_code_reader.py -v --tb=short

      - name: Run Workspace Boundary & Isolation Suite
        run: |
          python -m pytest backend/tests/unit/test_project_creator.py -v --tb=short
