[project]
name = "agentos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.14"
dependencies = [
    "alembic>=1.13.1",
    "fastapi>=0.109.2",
    "gitpython>=3.1.41",
    "httpx>=0.26.0",
    "langchain>=0.1.7",
    "langchain-core>=0.1.23",
    "langgraph>=0.0.24",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "psutil>=5.9.8",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.6.1",
    "pydantic-settings>=2.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "redis>=5.0.1",
    "sqlalchemy>=2.0.25",
    "uvicorn>=0.27.1",
    "websockets>=14,<17",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "strict"
tmp_path_retention_policy = "failed"

