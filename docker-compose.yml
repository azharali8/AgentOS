version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: 
      POSTGRES_USER: 
      POSTGRES_PASSWORD: 
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos -d agentos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agentos-net

  redis:
    image: redis:7-alpine
    container_name: agentos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - agentos-net

  backend:
    build:
      context: .
      target: runtime
    container_name: agentos-backend
    restart: unless-stopped
    environment:
      - AGENTOS_ENV=production
      - DATABASE_URL=postgresql://agentos:agentos_secure_password_123@postgres:5432/agentos
      - REDIS_URL=redis://redis:6379/0
      - QUEUE_BACKEND=redis
      - RATE_LIMIT_BACKEND=redis
      - EVENT_BACKEND=both
      - WORKSPACE_BASE_DIR=/app/workspace
      - ARTIFACTS_DIR=/app/artifacts
      - LOG_LEVEL=INFO
      - SESSION_SECRET_KEY=
      - ANTHROPIC_API_KEY=
      - OPENAI_API_KEY=
    ports:
      - "8000:8000"
    volumes:
      - agentos-data:/app/data
      - agentos-workspace:/app/workspace
      - agentos-artifacts:/app/artifacts
      - agentos-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - agentos-net

  frontend:
    image: node:20-slim
    container_name: agentos-frontend
    working_dir: /app
    command: sh -c "npm ci --legacy-peer-deps && npm run start -- -p 3000"
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NODE_ENV=production
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - agentos-net

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  agentos-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: 
  agentos-workspace:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: 
  agentos-artifacts:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: 
  agentos-logs:
    driver: local

networks:
  agentos-net:
    driver: bridge
